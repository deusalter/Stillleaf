name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build and test pure logic and synthetic adapters
        run: swift test --parallel
      - name: Release build
        run: swift build -c release
      - name: Native model and view self-check
        run: .build/release/BooksPresence --self-test-ui
      - name: Package development app
        run: scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BooksPresence-macOS-development
          path: dist/BooksPresence-*.zip
# CI does not grant Accessibility access or validate a live Books/Discord session.
