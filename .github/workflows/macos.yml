name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Reader/desktop/reader/package-lock.json
      - name: Toolchain
        run: swift --version && node --version
      - name: Build and test pure logic and synthetic adapters
        run: swift test --parallel
      - name: Release build
        run: swift build -c release
      - name: Build reader renderer next to the release binary
        id: reader-assets
        run: scripts/build-reader-assets.sh .build/release
      - name: Install headless Chromium and WebKit
        working-directory: Reader/desktop/reader
        run: npx playwright install chromium webkit
      - name: Renderer tests (headless Chrome and WebKit)
        run: npm --prefix Reader/desktop/reader test
      - name: Reader geometry and XHTML (headless WebKit)
        working-directory: Reader/desktop/reader
        run: |
          READER_TEST_BROWSER=webkit SLIDE_BROWSER=webkit SCROLL_BROWSER=webkit node --test --test-concurrency=1 test/visible-text.test.mjs test/visible-anchor.test.mjs test/render-stability.test.mjs test/page-slide.test.mjs test/continuous-geometry.test.mjs test/continuous-readiness.test.mjs test/continuous-layout-performance.test.mjs test/preference-burst.test.mjs test/appearance-controls.test.mjs test/screen-pagination.test.mjs test/pagination-lifecycle.test.mjs test/input-navigation.test.mjs test/native-chrome-browser.test.mjs
      - name: Native date-field semantics (offscreen)
        run: |
          swiftc -parse-as-library Sources/BooksPresence/ReadingDatePicker.swift scripts/native-date-field-smoke.swift -o "$RUNNER_TEMP/native-date-field-smoke"
          "$RUNNER_TEMP/native-date-field-smoke"
      # Native checks still run when renderer tests fail, so one red step never hides another.
      - name: Native model and view self-check
        if: ${{ !cancelled() && steps.reader-assets.outcome == 'success' }}
        run: .build/release/BooksPresence --self-test-ui
      - name: Synthetic History computation benchmark
        if: ${{ !cancelled() && steps.reader-assets.outcome == 'success' }}
        run: scripts/run-history-atlas-benchmark.sh 100000
      - name: Native History previews (synthetic, offscreen)
        if: ${{ !cancelled() && steps.reader-assets.outcome == 'success' }}
        run: .build/release/BooksPresence --render-ui "$RUNNER_TEMP/history-atlas" --history-atlas --offscreen
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Stillleaf-History-previews
          path: ${{ runner.temp }}/history-atlas/*.png
      - name: Native EPUB reader smoke (offscreen WKWebView, synthetic book)
        id: epub-smoke
        timeout-minutes: 7
        if: ${{ !cancelled() && steps.reader-assets.outcome == 'success' }}
        run: |
          python3 scripts/test-native-reader-smoke-runner.py
          python3 scripts/reader-review-fixture.py "$RUNNER_TEMP/reader-fixture.epub" --chapters 3
          mkdir -p "$RUNNER_TEMP/reader-appearance"
          python3 scripts/run-native-reader-smoke.py --timeout 300 --output "$RUNNER_TEMP/reader-diagnostics/release" -- .build/release/BooksPresence --self-test-epub "$RUNNER_TEMP/reader-fixture.epub" --reader-appearance-review --reader-artifacts "$RUNNER_TEMP/reader-appearance"
      - name: Native EPUB reader continuous smoke (synthetic 12-chapter book)
        id: continuous-smoke
        timeout-minutes: 7
        if: ${{ !cancelled() && steps.reader-assets.outcome == 'success' }}
        run: |
          python3 scripts/reader-review-fixture.py "$RUNNER_TEMP/reader-continuous.epub" --chapters 12
          python3 scripts/run-native-reader-smoke.py --timeout 300 --output "$RUNNER_TEMP/reader-diagnostics/continuous" -- .build/release/BooksPresence --self-test-epub "$RUNNER_TEMP/reader-continuous.epub" --reader-experimental-continuous
      - name: Native EPUB reader crash diagnostics
        timeout-minutes: 10
        if: ${{ failure() && steps.epub-smoke.outcome == 'failure' }}
        run: |
          fixture="$RUNNER_TEMP/reader-fixture.epub"
          [[ -f "$fixture" ]] || python3 scripts/reader-review-fixture.py "$fixture" --chapters 3
          report=$(ls -t ~/Library/Logs/DiagnosticReports/BooksPresence* 2>/dev/null | head -1 || true)
          if [[ -n "$report" ]]; then
            python3 - "$report" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          header, _, body = text.partition("\n")
          crash = json.loads(body)
          print("exception:", crash.get("exception"), crash.get("termination", {}).get("indicator"))
          images = crash.get("usedImages", [])
          thread = crash["threads"][crash.get("faultingThread", 0)]
          for frame in thread.get("frames", [])[:40]:
              image = images[frame["imageIndex"]].get("name", "?") if frame.get("imageIndex", -1) < len(images) else "?"
              print(f"{image:28} {frame.get('symbol', hex(frame.get('imageOffset', 0)))} {frame.get('sourceFile', '')}:{frame.get('sourceLine', '')}")
          PY
          fi
          # Debug builds report the exact trap message and source line.
          swift build
          scripts/build-reader-assets.sh .build/debug
          mkdir -p "$RUNNER_TEMP/reader-appearance-debug"
          python3 scripts/run-native-reader-smoke.py --timeout 300 --output "$RUNNER_TEMP/reader-diagnostics/debug" -- .build/debug/BooksPresence --self-test-epub "$fixture" --reader-appearance-review --reader-artifacts "$RUNNER_TEMP/reader-appearance-debug"
      - name: Upload native reader evidence and diagnostics
        if: ${{ always() && steps.epub-smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: Stillleaf-reader-smoke-diagnostics
          path: |
            ${{ runner.temp }}/reader-diagnostics/
            ${{ runner.temp }}/reader-appearance/
            ${{ runner.temp }}/reader-appearance-debug/
      - name: Package development app
        run: scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Stillleaf-macOS-development
          path: dist/Stillleaf-*.zip
# CI does not grant Accessibility access or validate a live Books/Discord session.
