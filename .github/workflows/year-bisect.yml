name: Year bisect (temporary)
on:
  push:
    branches: [perf/year-bisect]
jobs:
  bisect:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 471d297e11fe4efa239af0bb022a2964dee76e52
          path: .native-baseline
      - name: Build baseline and candidate
        run: |
          python3 scripts/install-native-benchmark-harness.py .native-baseline
          printf 'enum PerfVariant { static var flags: Set<String> = [] }\n' > .native-baseline/Sources/BooksPresence/PerfVariantStub.swift
          swift build --package-path .native-baseline -c release
          swift build -c release
      - name: Interleaved Year variants
        run: python3 scripts/bisect-year.py .native-baseline/.build/release/BooksPresence .build/release/BooksPresence "$RUNNER_TEMP/bisect"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: year-bisect
          path: ${{ runner.temp }}/bisect
