name: Native chrome SDK probe
on:
  workflow_dispatch:
  push:
    branches: [ui/native-macos-experience]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  sdk-probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            developer: /Applications/Xcode.app/Contents/Developer
          - os: macos-26
            developer: /Applications/Xcode_26.0.1.app/Contents/Developer
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
    steps:
      - uses: actions/checkout@v4
      - name: Exact SDK inventory
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - name: Real AppKit hosting and glass API probe
        run: |
          swiftc -parse-as-library -target "$(uname -m)-apple-macosx13.0" scripts/native-chrome-probe.swift -o "$RUNNER_TEMP/native-chrome-probe"
          "$RUNNER_TEMP/native-chrome-probe"
      - name: Native implementation build
        run: swift build -c release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        if: matrix.os == 'macos-26'
        with:
          ref: 471d297e11fe4efa239af0bb022a2964dee76e52
          path: .native-baseline
      - name: Matched synthetic baseline layout benchmark
        if: matrix.os == 'macos-26'
        run: |
          python3 scripts/install-native-benchmark-harness.py .native-baseline
          swift build --package-path .native-baseline -c release
          .native-baseline/.build/release/BooksPresence --benchmark-ui | tee "$RUNNER_TEMP/baseline-ui-benchmark.txt"
          .native-baseline/.build/release/BooksPresence --benchmark-settled-ui "$RUNNER_TEMP/baseline-settled-ui.json"
      - name: Reader assets and native synthetic smoke
        run: |
          scripts/build-reader-assets.sh .build/release
          .build/release/BooksPresence --self-test-ui
          .build/release/BooksPresence --benchmark-ui | tee "$RUNNER_TEMP/native-ui-benchmark.txt"
          .build/release/BooksPresence --benchmark-settled-ui "$RUNNER_TEMP/candidate-settled-ui.json"
          .build/release/BooksPresence --render-native-chrome "$RUNNER_TEMP/native-chrome"
          python3 scripts/reader-review-fixture.py "$RUNNER_TEMP/native-chrome.epub" --chapters 3
          mkdir -p "$RUNNER_TEMP/native-reader"
          .build/release/BooksPresence --self-test-epub "$RUNNER_TEMP/native-chrome.epub" --reader-artifacts "$RUNNER_TEMP/native-reader"
      - name: Enforce matched settled History and native feedback gates
        if: matrix.os == 'macos-26'
        run: |
          python3 scripts/check-native-performance.py "$RUNNER_TEMP/baseline-settled-ui.json" "$RUNNER_TEMP/candidate-settled-ui.json" "$RUNNER_TEMP/native-reader/native-feedback.json" "$RUNNER_TEMP/native-performance-gates.json"
      - name: Package modern SDK development app
        if: matrix.os == 'macos-26'
        run: scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-26'
        with:
          name: Stillleaf-native-macOS26-development
          path: dist/Stillleaf-*.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Stillleaf-native-chrome-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native-chrome
            ${{ runner.temp }}/native-reader
            ${{ runner.temp }}/native-ui-benchmark.txt
            ${{ runner.temp }}/baseline-ui-benchmark.txt
            ${{ runner.temp }}/baseline-settled-ui.json
            ${{ runner.temp }}/candidate-settled-ui.json
            ${{ runner.temp }}/native-performance-gates.json
  modern-package-fallback:
    needs: sdk-probe
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Stillleaf-native-macOS26-development
          path: ${{ runner.temp }}/modern-package
      - name: Run modern SDK app on fallback OS
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          ditto -x -k "$RUNNER_TEMP/modern-package/Stillleaf-arm64.zip" "$RUNNER_TEMP/modern-fallback"
          app="$RUNNER_TEMP/modern-fallback/Stillleaf.app/Contents/MacOS/BooksPresence"
          "$app" --self-test-ui
          "$app" --render-native-chrome "$RUNNER_TEMP/modern-fallback-captures"
          python3 scripts/reader-review-fixture.py "$RUNNER_TEMP/modern-fallback.epub" --chapters 3
          "$app" --self-test-epub "$RUNNER_TEMP/modern-fallback.epub"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Stillleaf-modern-package-fallback
          path: ${{ runner.temp }}/modern-fallback-captures
