name: Commit attribution
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
  pull-requests: read
jobs:
  commit-attribution:
    runs-on: ubuntu-latest
    steps:
      # No checkout: inspect metadata only, using the workflow on the base branch.
      # Never execute PR code in a pull_request_target workflow.
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const trailer = /^\s*(?:co-authored-by|claude-session)\s*:/im;
            const ai = /\b(?:claude|anthropic|codex|copilot|openai)\b/i;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo, pull_number: pr.number, per_page: 100
            });
            // GitHub limits this endpoint to 250 commits. Fail closed if incomplete.
            if (commits.length !== pr.commits) {
              core.setFailed('Could not inspect every PR commit; split the PR into smaller parts.');
            }
            if (trailer.test(pr.title + '\n' + (pr.body || ''))) {
              core.setFailed('Remove attribution trailers from the PR title and description.');
            }
            for (const {sha, commit} of commits) {
              if (trailer.test(commit.message)) {
                core.setFailed(`${sha}: forbidden attribution trailer`);
              }
              for (const role of ['author', 'committer']) {
                const identity = commit[role];
                if (!identity || ai.test(`${identity.name} <${identity.email}>`)) {
                  core.setFailed(`${sha}: invalid or AI ${role} identity`);
                }
              }
            }
